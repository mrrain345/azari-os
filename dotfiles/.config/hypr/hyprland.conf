monitor=HDMI-A-4, 1920x1080@60, 0x0, 1
monitor=eDP-1, 1920x1080@60, 1920x0, 1
monitor=DP-3, disable

workspace=1, monitor:HDMI-A-4, default:true
workspace=2, monitor:eDP-1, default:true

exec-once=uwsm app -- hyprlock --immediate

general {
  snap {
    enabled=true
  }
  border_size=2
  col.active_border=rgb(7199ee)
  col.inactive_border=rgb(374059)
  gaps_in=6
  gaps_out=12
  layout=master
  resize_on_border=true
}

ecosystem {
  no_update_news=true
}

master {
  mfact=0.67
}

input {
  kb_layout=pl
}

cursor {
  default_monitor=HDMI-A-4
  no_hardware_cursors=1
}

decoration {
  shadow {
    color=rgba(17172699)
  }
  dim_inactive=true
  dim_strength=0.3
  rounding=12
}

group {
  groupbar {
    col.active=rgb(7199ee)
    col.inactive=rgb(374059)
    text_color=rgb(a0a8cd)
  }
  col.border_active=rgb(7199ee)
  col.border_inactive=rgb(374059)
  col.border_locked_active=rgb(9fbbf3)
}

misc {
  animate_manual_resizes=true
  background_color=rgb(171726)
  disable_hyprland_logo=false
  disable_splash_rendering=true
  force_default_wallpaper=2
}

binds {
  movefocus_cycles_groupfirst=true
  drag_threshold=10
}

bind=SUPER, Return, exec, uwsm app -T
bind=SUPER, B, exec, uwsm app -- flatpak run com.google.Chrome --ozone-platform-hint=auto
bind=SUPER, V, exec, uwsm app -- code
bind=SUPER, F, exec, uwsm app -- nautilus --new-window
bind=SUPER, M, exec, uwsm app -- flatpak run org.signal.Signal --ozone-platform-hint=auto
bind=SUPER, K, exec, uwsm app -- flatpak run org.gnome.Calculator
bind=SUPER, T, exec, uwsm app -- flatpak run org.gnome.TextEditor
bind=SUPER, A, exec, uwsm app -- $(astal launcher)
bind=SUPER CTRL, L, exec, uwsm app -- hyprlock

bind=SUPER, left, movefocus, l
bind=SUPER, right, movefocus, r
bind=SUPER, up, movefocus, u
bind=SUPER, down, movefocus, d

bind=SUPER SHIFT, left, movewindow, l
bind=SUPER SHIFT, right, movewindow, r
bind=SUPER SHIFT, up, movewindow, u
bind=SUPER SHIFT, down, movewindow, d

bind=SUPER, TAB, layoutmsg, swapwithmaster
bind=SUPER SHIFT, TAB, swapactiveworkspaces, HDMI-A-4 eDP-1

bind=SUPER, X, killactive
bind=SUPER, slash, togglegroup

bind=SUPER CTRL, F11, fullscreen, 1
bind=, F11, fullscreen, 0

bind=SUPER CTRL, left, exec, hyprnome -p
bind=SUPER CTRL, right, exec, hyprnome
bind=SUPER CTRL SHIFT, left, exec, hyprnome -p -m
bind=SUPER CTRL SHIFT, right, exec, hyprnome -m

bind=SUPER, 1, workspace, 1
bind=SUPER, 2, workspace, 2
bind=SUPER, 3, workspace, 3
bind=SUPER, 4, workspace, 4
bind=SUPER, 5, workspace, 5
bind=SUPER, 6, workspace, 6
bind=SUPER, 7, workspace, 7
bind=SUPER, 8, workspace, 8
bind=SUPER, 9, workspace, 9
bind=SUPER, 0, workspace, 10

bind=SUPER SHIFT, 1, movetoworkspace, 1
bind=SUPER SHIFT, 2, movetoworkspace, 2
bind=SUPER SHIFT, 3, movetoworkspace, 3
bind=SUPER SHIFT, 4, movetoworkspace, 4
bind=SUPER SHIFT, 5, movetoworkspace, 5
bind=SUPER SHIFT, 6, movetoworkspace, 6
bind=SUPER SHIFT, 7, movetoworkspace, 7
bind=SUPER SHIFT, 8, movetoworkspace, 8
bind=SUPER SHIFT, 9, movetoworkspace, 9
bind=SUPER SHIFT, 0, movetoworkspace, 10

bind=, PRINT, exec, hyprshot -m region
bind=SUPER, PRINT, exec, hyprshot-no-cursor -m window -m active
bind=SUPER CTRL, PRINT, exec, hyprshot-no-cursor -m output -m active

bind=SUPER CTRL, ESCAPE, exec, systemctl poweroff
bind=SUPER CTRL, R, exec, systemctl reboot

bindc=SUPER, mouse:272, togglefloating

bindl=, XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=, XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=SUPER, F9, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=SUPER, F12, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bindle=, XF86AudioLowerVolume, exec, wpctl set-volume -l '1.0' @DEFAULT_AUDIO_SINK@ 5%-
bindle=, XF86AudioRaiseVolume, exec, wpctl set-volume -l '1.0' @DEFAULT_AUDIO_SINK@ 5%+
bindle=SUPER, F10, exec, wpctl set-volume -l '1.0' @DEFAULT_AUDIO_SINK@ 5%-
bindle=SUPER, F11, exec, wpctl set-volume -l '1.0' @DEFAULT_AUDIO_SINK@ 5%+

bindm=SUPER, mouse:272, movewindow
bindm=SUPER, mouse:273, resizewindow

exec-once=astal-shell
exec-once=gnome-keyring-daemon --start --components=secrets
exec-once=wl-clip-persist --clipboard regular

windowrule=float, class:org.signal.Signal
windowrule=persistentsize, class:org.signal.Signal
windowrule=float, class:com.obsproject.Studio
windowrule=persistentsize, class:com.obsproject.Studio
windowrule=float, class:xdg-desktop-portal-gtk
windowrule=bordercolor rgb(f6955b), fullscreen:1

# GIMP
windowrule=float, class:(file-)(.*), title:(Export Image as )(.*)